name: Bug report
description: Report reproducible Jelly behavior.
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "For security issues, use SECURITY.md instead of a public issue."
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What happened, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Minimal commands or steps. Remove secrets and personal data.
    validations:
      required: true
  - type: input
    id: commit
    attributes:
      label: Jelly version or commit
      placeholder: v0.1.0 or git SHA
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS, Rust version, Chromium version, and hosting mode when relevant.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Optional. Redact tokens, cookies, URLs containing secrets, and personal data.
