name: CI

on:
  push:
    branches:
      - main
      - vibe
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "site/**"
      - "assets/**"
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "site/**"
      - "assets/**"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    env:
      CARGO_TARGET_DIR: target
    steps:
      - uses: actions/checkout@v7
      - name: Cache Cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'rust-toolchain.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
      - name: Toolchain
        run: rustc --version && cargo --version
      - name: Unified developer checks
        run: ./scripts/dev.sh check
      - name: Compile Rust-only fixture and integration tools
        run: cargo check --quiet --locked --bin jelly-fcis-probe --bin jelly-fixture-server
      - name: Tool index
        run: scripts/check-tool-index.sh
      - name: Offline Rust tests
        run: |
          ./scripts/dev.sh test
          cargo test --locked \
            --bin jelly-maint \
            --bin agent-call-routine \
            --bin agent-profile-import \
            --bin agent-hitl
