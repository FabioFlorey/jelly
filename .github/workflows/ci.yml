name: CI

on:
  push:
    branches:
      - main
      - vibe
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    env:
      CARGO_TARGET_DIR: target
    steps:
      - uses: actions/checkout@v7
      - name: Cache Cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'rust-toolchain.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
      - name: Toolchain
        run: rustc --version && cargo --version
      - name: Unified developer checks
        run: ./scripts/dev.sh check
      - name: Require installed Chromium for actual browser tests
        shell: bash
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME"
          test -x "$CHROME"
          "$CHROME" --version
          echo "JELLY_VALIDATION_CHROMIUM=$CHROME" >> "$GITHUB_ENV"
      - name: Rust tests including real Chromium replay (all targets, once)
        shell: bash
        run: |
          set -uo pipefail
          LOG="$(mktemp)"
          trap 'rm -f "$LOG"' EXIT
          if ./scripts/dev.sh test 2>&1 | tee "$LOG"; then
            if ! grep -Fq 'real_chromium_replays_pinned_candidate_and_detects_failure ... ok' "$LOG"; then
              echo "::error title=Real Chromium test missing::The mandatory browser test did not run or report success."
              exit 1
            fi
            echo 'PASS: real isolated Chromium replay executed by canonical Rust test suite.'
          else
            # Public GitHub check-run annotations expose the failure reason
            # even when job logs require authenticated access.
            # Include the panic payload line: Rust prints the specific CDP
            # launch/timeout error *after* the panicked-at location.
            failure="$(grep -E -A 2 '^thread .* panicked at' "$LOG" | head -n 6 | tr '\n' ' ' || true)"
            if [[ -z "$failure" ]]; then
              failure="$(grep -E '^test .* \.\.\. FAILED$|^error:|^test result: FAILED' "$LOG" | tail -n 3 | tr '\n' ' ' || true)"
            fi
            failure="$(printf '%s' "$failure" | sed 's/%/%25/g')"
            if [[ -z "$failure" ]]; then failure='Rust suite failed; inspect the job log.'; fi
            echo "::error title=Rust suite (including Chromium) failed::$failure"
            exit 1
          fi
