name: CI

on:
  push:
    branches:
      - main
      - vibe
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    env:
      CARGO_TARGET_DIR: target
    steps:
      - uses: actions/checkout@v7
      - name: Cache Cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'rust-toolchain.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
      - name: Toolchain
        run: rustc --version && cargo --version
      - name: Unified developer checks
        run: ./scripts/dev.sh check
      - name: Require installed Chromium for actual browser tests
        shell: bash
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME"
          test -x "$CHROME"
          "$CHROME" --version
          echo "JELLY_VALIDATION_CHROMIUM=$CHROME" >> "$GITHUB_ENV"
      - name: Rust tests including real Chromium replay (all targets, once)
        run: ./scripts/dev.sh test
