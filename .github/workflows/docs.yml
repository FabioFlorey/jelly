name: Documentation

on:
  push:
    branches:
      - main
      - vibe
    paths:
      - 'docs/**'
      - 'README.md'
      - 'SECURITY.md'
      - 'LICENSE'
      - 'CONTRIBUTING.md'
      - 'src/execution/registry.rs'
      - 'src/execution/tools.rs'
      - 'src/agent/schema.rs'
      - 'src/agent/builtin.rs'
      - 'src/agent/browser_schema.rs'
      - 'src/agent/browser_call/schema.rs'
      - '.agent/instructions/**'
      - 'tests/fixtures/agent-guidance-cases.json'
      - 'scripts/maintenance/**'
      - '.agent/tools/index.md'
      - 'src/bin/jelly-maint.rs'
      - 'config/dev.config.sh'
      - 'config/brand/**'
      - 'scripts/dev.sh'
      - 'scripts/lib/**'
      - 'scripts/commands/**'
      - 'config/jelly.toml'
      - 'config/cargo.toml'
      - 'scripts/diagnostics/**'
      - 'scripts/tests/**'
      - '.github/workflows/docs.yml'
  pull_request:
    paths:
      - 'docs/**'
      - 'README.md'
      - 'SECURITY.md'
      - 'LICENSE'
      - 'CONTRIBUTING.md'
      - 'src/execution/registry.rs'
      - 'src/execution/tools.rs'
      - 'src/agent/schema.rs'
      - 'src/agent/builtin.rs'
      - 'src/agent/browser_schema.rs'
      - 'src/agent/browser_call/schema.rs'
      - '.agent/instructions/**'
      - 'tests/fixtures/agent-guidance-cases.json'
      - 'scripts/maintenance/**'
      - '.agent/tools/index.md'
      - 'src/bin/jelly-maint.rs'
      - 'config/dev.config.sh'
      - 'config/brand/**'
      - 'scripts/dev.sh'
      - 'scripts/lib/**'
      - 'scripts/commands/**'
      - 'config/jelly.toml'
      - 'config/cargo.toml'
      - 'scripts/diagnostics/**'
      - 'scripts/tests/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate documentation
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Check Markdown links, examples, structure and configuration drift
        run: cargo run --quiet --locked --bin jelly-maint -- check docs
      - name: Validate agent-guidance evaluation harness
        run: cargo run --quiet --locked --bin jelly-maint -- check agent-guidance --self-test
