name: Documentation

on:
  push:
    branches:
      - main
      - vibe
    paths:
      - 'docs/**'
      - 'README.md'
      - 'SECURITY.md'
      - 'LICENSE'
      - 'CONTRIBUTING.md'
      - 'src/execution/registry.rs'
      - 'src/execution/tools.rs'
      - 'src/agent/schema.rs'
      - 'src/agent/builtin.rs'
      - 'src/agent/browser_schema.rs'
      - 'src/agent/browser_call/schema.rs'
      - '.agent/instructions/**'
      - 'tests/fixtures/agent-guidance-cases.json'
      - 'scripts/eval-agent-guidance.py'
      - '.agent/tools/index.md'
      - 'scripts/check-docs.py'
      - 'config/jelly.toml'
      - 'config/cargo.toml'
      - 'scripts/clean-runtime.sh'
      - '.github/workflows/docs.yml'
  pull_request:
    paths:
      - 'docs/**'
      - 'README.md'
      - 'SECURITY.md'
      - 'LICENSE'
      - 'CONTRIBUTING.md'
      - 'src/execution/registry.rs'
      - 'src/execution/tools.rs'
      - 'src/agent/schema.rs'
      - 'src/agent/builtin.rs'
      - 'src/agent/browser_schema.rs'
      - 'src/agent/browser_call/schema.rs'
      - '.agent/instructions/**'
      - 'tests/fixtures/agent-guidance-cases.json'
      - 'scripts/eval-agent-guidance.py'
      - '.agent/tools/index.md'
      - 'scripts/check-docs.py'
      - 'config/jelly.toml'
      - 'config/cargo.toml'
      - 'scripts/clean-runtime.sh'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate documentation
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Check Markdown links, examples, structure and configuration drift
        run: python3 scripts/check-docs.py
      - name: Validate agent-guidance evaluation harness
        run: python3 scripts/eval-agent-guidance.py --self-test
